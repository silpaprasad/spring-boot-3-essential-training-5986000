<!DOCTYPE html>
<html lang="en" xmlns: th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Landon Hotel | Rooms</title>
</head>
<body>
  <table>
    <tr>
      <th>Room Number</th>
      <th>Room Name</th>
      <th>Bed Info</th>
    </tr>
    <tr th:each="room:${rooms}">  <!-- this is a loop -->
      <td th:text="${room.number}">Number</td> <!--Replace inner HTML/text with room.number value-->
      <td th:text="${room.name}">Name</td>
      <th th:text="${room.info}">Info</th> <!-- number,name,infö are placeholder text that replaces empty value if there is no data-->
    </tr>
  </table>

</body>
</html>
